<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row my-5 justify-content-center align-items-center">
        <div class="col-md-6 col-12">
            <form action="" method="post" class="bg-light p-4 rounded shadow">
                <div class="mb-3">
                    <label for="name" class="form-label">ProductName</label>
                    <input type="text" class="form-control" id="ProductName" placeholder="ProductName" required>
                </div>
                <div class="mb-3">
                    <label for="Product-price" class="form-label">Product price</label>
                    <input type="number" class="form-control" id="Product-price" placeholder="Product price">
                </div>
                <div class="mb-3">
                    <label for="Product-category" class="form-label">Product category</label>
                    <input type="text" class="form-control" id="Product-category" placeholder="Product category">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Product Description</label>
                    <textarea class="form-control" id="message" rows="3"></textarea>
                </div>
                <button type="submit" id="btnSubmit" class="btn btn-primary float-end">Submit</button>
                <div class="clearfix"></div>
                
            </form>
            <div class="col-md-6 col-12 mt-3 d-flex justify-content-center align-items-center">
                <div class="alert alert-success d-none" id="successMessage" >
                    Form submitted successfully!
                </div>
            </div>
        </div>
      
</div>
<div class="container">
    <div class="row  justify-content-center align-items-center">
        <table class="table table-success table-striped ">

            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Product Price</th>
                    <th>Product Description</th> 
                    <th>Delet</th>
                    <th>Addet</th>
                    <th>Update</th>                     
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Product rows will be added here dynamically -->
            </tbody>
        </table>
    </div>
</div>











<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
 integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" 
crossorigin="anonymous"></script>
<script src="assts/js/main.js"></script>
</body>
</html>
