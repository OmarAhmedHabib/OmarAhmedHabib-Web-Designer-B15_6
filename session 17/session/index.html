<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
     crossorigin="anonymous">
</head>
<body>
    
<div class="container">
    <div class="row my-5 justify-content-center align-items-center">
        <div class="col-md-6 col-12">
            <form id="addNewUser" class="bg-light p-4 rounded shadow">
                <div class="mb-3">
                  
                    <input type="text" class="form-control" name="userName" placeholder="User Name" required>
                </div>
                <div class="mb-3">
                   
                    <input type="text" class="form-control" name="userEmail" placeholder="Email">
                </div>
                <div class="mb-3">
                 
                    <input type="text" class="form-control" name="userphone"   placeholder="Phone">
                </div>
                <div class="mb-3">
                    <select  class="form-select" name="roleUser">
                        <option value="">User-Name</option>
                        <option value="">Admin-Name</option>
                        <option value="">Studint</option>
                    </select>
                
                </div>
                <div class="text-end">
                    <button type="submit" id="btnSubmit" class="btn btn-primary ">Submit</button>

                </div>
                
            </form>
           
        </div>
      
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
     crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
</body>
</html>
